name: Build Executables

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pygame
      - name: Build Single-File Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Quiz-Windows-x64" --icon="Assets/app-icon.ico" --add-data "Assets;Assets" main.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Windows-x64
          path: dist/Quiz-Windows-x64.exe

  build-macos-arm64:
    name: Build macOS 15 (Apple Silicon) Executable
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller pillow pygame
      - name: Build Single-File Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Quiz-macOS-ARM64" --icon="Assets/app-icon.ico" --add-data "Assets:Assets" main.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-macOS-ARM64
          path: dist/Quiz-macOS-ARM64

  build-linux-ubuntu:
    name: Build Linux Ubuntu Executable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pygame
      - name: Build Single-File Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Quiz-Linux-Ubuntu" --icon="Assets/app-icon.ico" --add-data "Assets:Assets" main.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Linux-Ubuntu
          path: dist/Quiz-Linux-Ubuntu

  build-linux-arch:
    name: Build Linux Arch Executable
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Sy --noconfirm git gcc python python-pip tk sdl2 sdl2_mixer sdl2_image sdl2_ttf
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          pip install --break-system-packages pyinstaller pillow pygame
      - name: Build Single-File Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Quiz-Linux-Arch" --icon="Assets/app-icon.ico" --add-data "Assets:Assets" main.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Linux-Arch
          path: dist/Quiz-Linux-Arch

  build-linux-fedora:
    name: Build Linux Fedora/RedHat Executable
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install system packages
        run: |
          dnf install -y git gcc python3 python3-pip python3-tkinter SDL2-devel SDL2_mixer-devel SDL2_image-devel SDL2_ttf-devel redhat-rpm-config
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          pip install pyinstaller pillow pygame
      - name: Build Single-File Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Quiz-Linux-Fedora" --icon="Assets/app-icon.ico" --add-data "Assets:Assets" main.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Linux-Fedora
          path: dist/Quiz-Linux-Fedora