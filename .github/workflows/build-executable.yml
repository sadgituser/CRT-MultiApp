name: Build Executables

on:
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: Build macOS 15 (Apple Silicon) Executable
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller pillow pygame

      - name: Build Single-File Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name "Quiz-macOS-ARM64" --icon="Assets/app-icon.icns" --add-data "Assets:Assets" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-macOS-ARM64
          path: dist/Quiz-macOS-ARM64

  build-linux-ubuntu:
    name: Build Linux Ubuntu Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pygame

      - name: Build Single-File Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name "Quiz-Linux-Ubuntu" --icon="Assets/app-icon.ico" --add-data "Assets:Assets" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quiz-Linux-Ubuntu
          path: dist/Quiz-Linux-Ubuntu
